const statuses = [
  { v:"", l:"Все статусы" },
  { v:"registration_open", l:"Регистрация открыта" },
  { v:"anons", l:"Анонс" },
  { v:"ongoing", l:"Идёт сейчас" },
];
let MODE = "by_region", REGION = "", STATUS = "", DATA = null;

const $ = id => document.getElementById(id);
function fmtDate(s){ if(!s) return ""; const [y,m,d] = s.split("-"); return `${d}.${m}.${y}`; }
function fmtPrize(p){ return p == null ? "" : new Intl.NumberFormat("ru-RU").format(p) + " ₽"; }
const STATUS_LABEL = { registration_open:"Регистрация открыта", anons:"Анонс", ongoing:"Идёт сейчас", registration_closed:"Регистрация закрыта", finished:"Прошло", postponed:"Перенесено" };

function setMode(m){
  MODE = m;
  $("tab-reg").classList.toggle("on", m==="by_region");
  $("tab-nat").classList.toggle("on", m==="national");
  draw();
}
function draw(){
  const events = (DATA.events||[])
    .filter(e => MODE==="national" ? e.event_type!=="regional" : e.event_type==="regional")
    .filter(e => !REGION || e.region_id == REGION)
    .filter(e => !STATUS || e.status===STATUS)
    .sort((a,b)=>a.event_date<b.event_date?-1:1);
  const names = {};
  (DATA.regions||[]).forEach(r => names[r.id]=r.name);
  $("title").textContent = MODE==="national" ? "Все крупные и всероссийские старты"
      : (REGION ? names[REGION] || "Регион" : "Все регионы");
  $("found").textContent = "Найдено: " + events.length;
  STATUS_LABEL.static = null;
  $("list").innerHTML = events.length ? events.map(card).join("") :
      `<div class="empty">Пока ничего не найдено. Попробуйте другой регион или статус.</div>`;
}
function card(e){
  const st = STATUS_LABEL[e.status] ? `<span class="status st-${e.status.replace('registration_','reg-').replace('_open','open').replace('_closed','closed').replace('registration_open','open')}">${STATUS_LABEL[e.status]}</span>` : "";
  const prize = e.prize_fund_amount ? `<span class="prize">🏆 Призовой фонд ${fmtPrize(e.prize_fund_amount)}</span>`
      : (e.prize_fund_note && e.prize_fund_visibility==="tbd" ? `<span class="prize">🏆 ${e.prize_fund_note}</span>` : "");
  const reg = e.registration_url ? `<a class="a-reg" href="${e.registration_url}" target="_blank" rel="noreferrer">Зарегистрироваться</a>` : "";
  const src = e.source_url ? `<a class="a-src" href="${e.source_url}" target="_blank" rel="noreferrer">Первоисточник ↗</a>` : "";
  return `<div class="card">
    <div class="top"><span class="date">${fmtDate(e.event_date)}${e.event_time ? " · " + e.event_time : ""}</span>${st}</div>
    <h3>${(e.title||"").split("\\n")[0]}</h3>
    <div class="meta">${e.region_name || "Россия"}${e.city ? " · " + e.city : ""}
      <span class="chip">уверенность ${Math.round((e.confidence||0)*100)}%</span></div>
    ${prize}
    ${(reg||src) ? `<div class="actions">${reg}${src}</div>` : ""}
  </div>`;
}
// init
statuses.forEach(s=>{
  const b = document.createElement("button");
  b.textContent = s.l; b.onclick = () => { STATUS = s.v;
    document.querySelectorAll("#status button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); draw(); };
  if(!s.v) b.classList.add("on");
  $("status").appendChild(b);
});
$("region").addEventListener("change", e => { REGION = e.target.value; draw(); });

(async () => {
  let live = null, base = "https://drone-racing-backend.onrender.com/api/v1";
  try {
    const [ev, rg, st] = await Promise.all([
      fetch(base + "/events?mode=all&only_upcoming=true&limit=100", {cache:"no-store"}),
      fetch(base + "/regions?only_with_events=true", {cache:"no-store"}),
      fetch(base + "/stats", {cache:"no-store"}),
    ]);
    if (ev.ok && rg.ok) {
      live = {
        generated: new Date().toISOString().slice(0,10),
        events: (await ev.json()).items,
        regions: await rg.json(),
        stats: st.ok ? await st.json() : {},
      };
    }
  } catch (e) {}
  DATA = live || FALLBACK;
  const rg = DATA.regions || [];
  $("region").innerHTML = '<option value="">— все регионы (' + DATA.events.length + ') —</option>' +
      rg.slice().sort((a,b)=>b.upcoming_events-a.upcoming_events)
        .map(r=>`<option value="${r.id}">${r.name} (${r.upcoming_events})</option>`).join("");
  $("sub").innerHTML = (DATA.stats && DATA.stats.upcoming_total)
      ? `Сейчас в базе: <b>${DATA.stats.upcoming_total}</b> предстоящих стартов в <b>${DATA.stats.regions_with_events||0}</b> регионах${live ? "" : " (офлайн-снимок, обновится при доступе к облаку)"}.`
      : "Данные офлайн-снимка.";
  $("note").style.display = live ? "none" : "block";
  if (!live) $("note").textContent = "Облачный сервер временно недоступен — показан локальный снимок базы. Данные обновятся при следующем открытии.";
  $("gen").textContent = DATA.generated || "";
  draw();
})();
</script>
</body>
</html>
