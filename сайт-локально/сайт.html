<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дрон Рейсинг — мероприятия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#121214;--line:#232326;--line2:#2e2e33;--txt:#f2f2f3;--muted:#8b8b90;--dim:#5a5a60;--acc:#ff4d1c;--acc2:#ff7a4d}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
select{appearance:none}
::selection{background:rgba(255,77,28,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.wrap{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:260px;background:#0d0d0f;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.side .logo{display:flex;align-items:center;gap:8px;padding:16px 20px;border-bottom:1px solid var(--line)}
.side .logo b{font-family:Oswald,Impact,sans-serif;font-style:italic;font-size:22px;letter-spacing:-.02em;text-transform:uppercase}
.side .logo span{background:var(--acc);color:#000;border-radius:3px;padding:2px 6px;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:16px 12px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nav p{color:var(--dim);font-size:10px;letter-spacing:.2em;padding:0 8px 8px}
.nav button,.nav a{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;margin-bottom:4px;border-left:2px solid transparent;color:var(--muted);transition:color .15s}
.nav button:hover,.nav a:hover{color:#fff}
.nav .active{border-left-color:var(--acc);background:#1a1210;color:var(--acc2)}
.side .ver{padding:12px 20px;border-top:1px solid var(--line);color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.main{flex:1;min-width:0;padding-left:260px}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 32px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.crumbs{display:flex;gap:8px;align-items:center}
.crumbs .sep{color:#3d3d44}
.crumbs .cur{color:var(--acc2)}
.crumbs .root{color:rgba(255,255,255,.85)}
.content{max-width:1240px;margin:0 auto;padding:32px 32px 80px}
h1{font-family:Oswald,Impact,sans-serif;font-style:italic;font-weight:700;text-transform:uppercase;font-size:56px;line-height:1;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:12px}
.sub b{color:rgba(255,255,255,.9)}
.tabs{display:flex;gap:28px;margin-top:28px;border-bottom:1px solid var(--line)}
.tab{padding-bottom:12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;transition:color .15s}
.tab:hover{color:#fff}
.tab.active{border-bottom-color:var(--acc);color:var(--acc2)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:20px}
.modes{display:flex;gap:20px;flex-wrap:wrap}
.mode{border-bottom:2px solid transparent;padding-bottom:6px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;transition:color .15s}
.mode:hover{color:#fff}
.mode.active{border-bottom-color:var(--acc);color:var(--acc2)}
.controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sel{height:36px;min-width:180px;border:1px solid var(--line2);background:#0f0f11;color:#d6d6da;border-radius:4px;padding:0 12px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;outline:none}
.sel:hover{border-color:#3d3d44}
.sel:focus{border-color:rgba(255,77,28,.7)}
.section{margin-top:36px}
.sec-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-bottom:16px}
.sec-head h2{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sec-head span{font-size:11px;font-weight:700;color:var(--dim)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.grid{grid-template-columns:1fr}.side{display:none}.main{padding-left:0}.content{padding:20px}}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#3a3a40}
.card .art{position:relative;height:96px;overflow:hidden;background:radial-gradient(120% 140% at 85% -20%,rgba(255,77,28,.28),transparent 60%),linear-gradient(160deg,#1b1b1f,#101012)}
.card .art:after{content:"";position:absolute;inset:0;opacity:.14;background-image:repeating-linear-gradient(115deg,transparent 0 22px,#fff 22px 23px)}
.badge{position:absolute;left:12px;top:12px;border-radius:3px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:1}
.b-ongoing{background:var(--acc);color:#000}
.b-reg{background:var(--acc);color:#000}
.b-anons{border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.85);background:rgba(0,0,0,.4)}
.b-finished{background:#2a2a2e;color:rgba(255,255,255,.55)}
.b-postponed{background:#3a2a10;color:#ffb02e}
.b-cancelled{background:#3a1414;color:#ff6b6b}
.tag-nat{position:absolute;right:12px;top:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:rgba(255,255,255,.7);border-radius:3px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:1}
.card .body{display:flex;flex-direction:column;flex:1;padding:16px}
.date{color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.date i{color:rgba(255,255,255,.4);font-style:normal}
.card h3{margin-top:6px;font-size:15px;font-weight:800;line-height:1.35;letter-spacing:.03em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place{margin-top:4px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{border:1px solid var(--line2);color:#b9b9be;border-radius:3px;padding:2px 6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tag.prize{border-color:rgba(255,77,28,.45);background:rgba(255,77,28,.1);color:var(--acc2)}
.tag.dim{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:16px}
.btn{display:inline-block;border-radius:4px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:.15s}
.btn-primary{background:var(--acc);color:#000}
.btn-primary:hover{background:#ff6a3f}
.btn-ghost{border:1px solid var(--line2);color:#b9b9be}
.btn-ghost:hover{border-color:rgba(255,77,28,.6);color:var(--acc2)}
.empty{border:1px dashed var(--line2);border-radius:4px;padding:32px;text-align:center;color:var(--muted);font-size:13px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pager button:hover{color:#fff}
.pager button:disabled{opacity:.3;cursor:default}
.cal{border:1px solid var(--line);background:#0f0f11;border-radius:4px;margin-top:32px;overflow:hidden}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.cal-head .t{font-family:Oswald,Impact,sans-serif;font-style:italic;font-weight:700;text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.cal-head button{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.cal-head button:hover{color:#fff}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);text-align:center}
.cal-dow div{padding:8px 0;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:92px;border-right:1px solid #1b1b1e;border-bottom:1px solid #1b1b1e;padding:6px}
.cell.today{background:rgba(255,77,28,.06)}
.cell .d{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px}
.cell.today .d{background:var(--acc);color:#000}
.ev-chip{display:block;border-left:2px solid var(--acc);background:rgba(255,77,28,.1);color:#ffb9a3;border-radius:2px;padding:2px 4px;margin-bottom:2px;font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-chip:hover{background:rgba(255,77,28,.2)}
.more{color:var(--dim);font-size:9px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:56px;border-top:1px solid var(--line);padding-top:20px;color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.loading{text-align:center;padding:48px 0;color:var(--muted);font-size:13px}
.err{border:1px solid rgba(255,77,28,.35);background:rgba(255,77,28,.1);color:#ff9a7a;border-radius:4px;padding:16px;margin-top:32px;font-size:13px}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ad44a;margin-right:6px;vertical-align:middle}
</style>
</head>

<div class="wrap">

  <div class="main">

    <main class="content">
      <h1>Мероприятия</h1>
      <p class="sub" id="counts">Загрузка…</p>

      <div class="tabs">
        <button class="tab active" id="tabList" onclick="setView('list')">☰ Список</button>
        <button class="tab" id="tabCal" onclick="setView('calendar')">▦ Календарь</button>
      </div>

      <div class="filters">
        <div class="modes">
          <button class="mode active" data-mode="all" onclick="setMode('all')">Все</button>
          <button class="mode" data-mode="regional" onclick="setMode('regional')">Региональные</button>
          <button class="mode" data-mode="national" onclick="setMode('national')">Всероссийские</button>
        </div>
        <div class="controls">
          <input class="sel" id="qInput" placeholder="Поиск: название, город…" oninput="onSearch(this.value)" style="min-width:200px;text-transform:none">
          <select class="sel" id="regionSel" onchange="setRegion(this.value)"></select>
          <select class="sel" id="statusSel" onchange="setStatus(this.value)">
            <option value="">— все статусы —</option>
            <option value="registration_open">Регистрация открыта</option>
            <option value="anons">Анонс</option>
            <option value="ongoing">Идёт сейчас</option>
          </select>
        </div>
      </div>

      <div id="alert"></div>
      <div id="content"><p class="loading">Загрузка…</p></div>

      <footer>
        <span id="footLeft">© 2026 Дрон Рейсинг</span>
        <span id="footRight">Данные собираются автоматически</span>
      </footer>
    </main>
  </div>
</div>

<script>
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_UP=["ЯНВАРЬ","ФЕВРАЛЬ","МАРТ","АПРЕЛЬ","МАЙ","ИЮНЬ","ИЮЛЬ","АВГУСТ","СЕНТЯБРЬ","ОКТЯБРЬ","НОЯБРЬ","ДЕКАБРЬ"];
const WEEK=["ПН","ВТ","СР","ЧТ","ПТ","СБ","ВС"];
const STATUS={anons:["АНОНС","b-anons"],registration_open:["РЕГИСТРАЦИЯ","b-reg"],registration_closed:["ЗАКРЫТА","b-anons"],ongoing:["ИДЁТ","b-ongoing"],finished:["ЗАВЕРШЕНО","b-finished"],postponed:["ПЕРЕНЕСЕНО","b-postponed"],cancelled:["ОТМЕНЕНО","b-cancelled"]};
const PAGE_SIZE=9;
let DATA=(()=>{const raw=document.getElementById("snapshot").textContent
  .replace("/*FALLBACK_JSON*/","").replace("/*END*/","").trim();
  try{return JSON.parse(raw);}catch(e){return {generated:"",stats:{},regions:[],events:[]};}})();
let state={mode:"all",region:"",status:"",q:"",view:"list",page:1,month:null,live:false};

function iso(d){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function today(){return iso(new Date());}
function fmtDate(s){const [y,m,d]=s.split("-").map(Number);return d+" "+(MONTHS[m-1]||"")+" "+y;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v){return new Intl.NumberFormat("ru-RU").format(v)+" ₽";}

function filtered(){
  const ev=DATA.events||[];
  const q=(state.q||"").toLowerCase();
  return ev.filter(e=>{
    if(state.mode!=="all" && e.event_type!==state.mode) return false;
    if(state.region && String(e.region_id||"")!==state.region) return false;
    if(state.status && e.status!==state.status) return false;
    if(q){
      const hay=[e.title,e.city,e.venue,e.organizer,e.region_name].filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function split(){
  const t=today();
  const ev=filtered().slice().sort((a,b)=>a.event_date<b.event_date?-1:1);
  const ongoing=ev.filter(e=>e.status==="ongoing"||(e.event_date===t&&e.status!=="finished"));
  const ids=new Set(ongoing.map(e=>e.id));
  const upcoming=ev.filter(e=>e.event_date>=t&&e.status!=="finished"&&!ids.has(e.id));
  const past=ev.filter(e=>e.event_date<t||e.status==="finished").sort((a,b)=>a.event_date>b.event_date?-1:1);
  return {ongoing,upcoming,past};
}

function card(e){
  const st=STATUS[e.status]||STATUS.anons;
  const prize=(e.prize_fund_visibility==="amount"&&e.prize_fund_amount)?'<span class="tag prize">'+esc(money(e.prize_fund_amount))+'</span>':"";
  const tbd=e.prize_fund_visibility==="tbd"?'<span class="tag dim">Фонд уточняется</span>':"";
  const place=[e.city,e.venue].filter(Boolean).join(", ")||e.region_name||"Место уточняется";
  const nat=e.event_type==="national"?'<span class="tag-nat">Всероссийское</span>':"";
  const time=e.event_time?" · "+esc(e.event_time):"";
  const approx=e.date_time_precision==="approx"?' <i>· дата уточняется</i>':"";
  return '<article class="card"><div class="art"><span class="badge '+st[1]+'">'+st[0]+'</span>'+nat+'</div>'+
    '<div class="body"><p class="date">'+fmtDate(e.event_date)+time+approx+'</p>'+
    '<h3>'+esc(e.title)+'</h3><p class="place">'+esc(place)+'</p>'+
    '<div class="tags">'+(e.region_name?'<span class="tag">'+esc(e.region_name)+'</span>':"")+
    (e.organizer?'<span class="tag">'+esc(e.organizer)+'</span>':"")+prize+tbd+'</div>'+
    '<div class="actions">'+(e.registration_url?'<a class="btn btn-primary" target="_blank" rel="noopener" href="'+esc(e.registration_url)+'">Регистрация</a>':"")+
    '<a class="btn btn-ghost" target="_blank" rel="noopener" href="'+esc(e.source_url||"#")+'">Источник</a></div></div></article>';
}

function grid(items){return '<div class="grid">'+items.map(card).join("")+'</div>';}
function section(title,count,inner){return '<section class="section"><div class="sec-head"><h2>'+title+'</h2><span>'+count+'</span></div>'+inner+'</section>';}

function renderList(){
  const {ongoing,upcoming,past}=split();
  const pages=Math.max(1,Math.ceil(past.length/PAGE_SIZE));
  if(state.page>pages)state.page=pages;
  const slice=past.slice((state.page-1)*PAGE_SIZE,state.page*PAGE_SIZE);
  let html="";
  html+=section("Идут сейчас",ongoing.length,ongoing.length?grid(ongoing):'<div class="empty">Сейчас активных мероприятий нет.</div>');
  html+=section("Предстоящие",upcoming.length,upcoming.length?grid(upcoming):'<div class="empty">Пока нет предстоящих мероприятий — попробуйте другой регион или тип.</div>');
  let pastInner=past.length?grid(slice):'<div class="empty">Архив пуст.</div>';
  if(past.length&&pages>1){
    pastInner+='<div class="pager"><button '+(state.page<=1?"disabled":"")+' onclick="setPage('+(state.page-1)+')">← Назад</button>'+
      '<span>Стр. '+state.page+' из '+pages+'</span>'+
      '<button '+(state.page>=pages?"disabled":"")+' onclick="setPage('+(state.page+1)+')">Вперёд →</button></div>';
  }
  html+=section("Прошедшие",past.length,pastInner);
  return html;
}

function renderCalendar(){
  const now=new Date();
  if(!state.month)state.month={y:now.getFullYear(),m:now.getMonth()};
  const {y,m}=state.month;
  const first=new Date(y,m,1);
  const days=new Date(y,m+1,0).getDate();
  const off=(first.getDay()+6)%7;
  const byDate={};
  filtered().forEach(e=>{(byDate[e.event_date]=byDate[e.event_date]||[]).push(e);});
  let cells="";
  for(let i=0;i<off;i++)cells+='<div class="cell"></div>';
  for(let d=1;d<=days;d++){
    const key=iso(new Date(y,m,d));
    const evs=(byDate[key]||[]).sort((a,b)=>a.title<b.title?-1:1);
    const cls=key===today()?"cell today":"cell";
    let inner='<span class="d">'+d+'</span>';
    evs.slice(0,2).forEach(e=>{inner+='<a class="ev-chip" target="_blank" rel="noopener" title="'+esc(e.title)+'" href="'+esc(e.source_url||"#")+'">'+esc(e.title)+'</a>';});
    if(evs.length>2)inner+='<span class="more">+'+(evs.length-2)+'</span>';
    cells+='<div class="'+cls+'">'+inner+'</div>';
  }
  const pad=(7-(off+days)%7)%7;
  for(let i=0;i<pad;i++)cells+='<div class="cell"></div>';
  return '<div class="cal"><div class="cal-head"><button onclick="shiftMonth(-1)">←</button>'+
    '<span class="t">'+MONTHS_UP[m]+' '+y+'</span>'+
    '<button onclick="shiftMonth(1)">→</button></div>'+
    '<div class="cal-dow">'+WEEK.map(w=>'<div>'+w+'</div>').join("")+'</div>'+
    '<div class="cal-grid">'+cells+'</div></div>';
}

function render(){
  const host=document.getElementById("content");
  host.innerHTML=state.view==="list"?renderList():renderCalendar();
  const {ongoing,upcoming,past}=split();
  document.getElementById("counts").innerHTML='<b>'+(ongoing.length+upcoming.length)+'</b> предстоящих · <b>'+past.length+'</b> в архиве'+
    (state.live?' <span class="live"></span><span style="font-size:11px;letter-spacing:.1em;text-transform:uppercase">live</span>':"");
  document.getElementById("footRight").textContent="Данные собираются автоматически · "+fmtDate(today());
  const r=DATA.regions.find(x=>String(x.id)===state.region);
  document.getElementById("footLeft").textContent="© 2026 Дрон Рейсинг"+(r?" · "+r.name:"");
  document.getElementById("navList").classList.toggle("active",state.view==="list");
  document.getElementById("navCal").classList.toggle("active",state.view==="calendar");
  document.getElementById("tabList").classList.toggle("active",state.view==="list");
  document.getElementById("tabCal").classList.toggle("active",state.view==="calendar");
  document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));
}

function fillRegions(){
  const groups={};
  DATA.regions.forEach(r=>{(groups[r.federal_district||"—"]=groups[r.federal_district||"—"]||[]).push(r);});
  let html='<option value="">— все регионы —</option>';
  Object.keys(groups).sort().forEach(g=>{
    html+='<optgroup label="'+esc(g)+'">';
    groups[g].sort((a,b)=>a.name<b.name?-1:1).forEach(r=>{
      html+='<option value="'+r.id+'">'+esc(r.name)+(r.upcoming_events?" ("+r.upcoming_events+")":"")+'</option>';
    });
    html+='</optgroup>';
  });
  const sel=document.getElementById("regionSel");
  sel.innerHTML=html;
  sel.value=state.region;
}

function setView(v){state.view=v;state.page=1;render();window.scrollTo({top:0});}
function setMode(m){state.mode=m;state.page=1;render();}
function setRegion(v){state.region=v;state.page=1;render();}
let qTimer=null;
function onSearch(v){clearTimeout(qTimer);qTimer=setTimeout(()=>{state.q=v.trim();state.page=1;render();},400);}
function setStatus(v){state.status=v;state.page=1;render();}
function setPage(p){state.page=p;render();window.scrollTo({top:0});}
function shiftMonth(d){state.month.m+=d;if(state.month.m<0){state.month.m=11;state.month.y--;}if(state.month.m>11){state.month.m=0;state.month.y++;}render();}

async function refreshLive(){
  try{
    const base="https://drone-racing-backend.onrender.com/api/v1";
    const ctl=new AbortController();
    const t=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(base+"/events?mode=all&only_upcoming=false&limit=100&page=1",{signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok)return;
    const p=await r.json();
    if(!p.items||!p.items.length)return;
    let all=[...p.items];
    const pages=Math.ceil((p.total||0)/100);
    for(let i=2;i<=Math.min(pages,5);i++){
      const r2=await fetch(base+"/events?mode=all&only_upcoming=false&limit=100&page="+i);
      if(!r2.ok)break;
      const p2=await r2.json();
      all=all.concat(p2.items||[]);
    }
    const map={};all.forEach(e=>map[e.id]=e);
    const regs=await (await fetch(base+"/regions?only_with_events=false")).json();
    DATA.events=Object.values(map);
    DATA.regions=regs.map(x=>({id:x.id,name:x.name,federal_district:x.federal_district||"—",upcoming_events:x.upcoming_events}));
    DATA.live=true;
    state.live=true;
    fillRegions();
    render();
  }catch(e){}
}

function boot(){
  fillRegions();
  render();
  refreshLive();
  setInterval(refreshLive,300000);
}
boot();
</script>
