name: collect

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend collection
        run: |
          curl -sS -X POST \
            "https://drone-racing-backend.onrender.com/api/v1/admin/run_collect" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            | tail -c 800
