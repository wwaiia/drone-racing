name: collect

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (playwright + chromium)
        run: |
          python -m pip install --upgrade pip
          pip install httpx playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Collect VK walls -> cloud
        env:
          API_BASE: https://drone-racing-backend.onrender.com
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python backend/scripts/vk_collect.py --limit 8

      - name: Trigger backend TG/FGDR collection
        run: |
          curl -sS -X POST \
            "https://drone-racing-backend.onrender.com/api/v1/admin/run_collect" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            | tail -c 800

      - name: Wait for collection to finish
        run: |
          for i in $(seq 1 60); do
            sleep 20
            RUNNING=$(curl -sS "https://drone-racing-backend.onrender.com/api/v1/admin/collect_status" \
              -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" | grep -o '"running":[a-z]*' | cut -d: -f2)
            echo "attempt $i running=$RUNNING"
            [ "$RUNNING" = "false" ] && break
          done

      - name: Backup DB into repo
        run: |
          mkdir -p backend/backup
          curl -sS "https://drone-racing-backend.onrender.com/api/v1/admin/backup" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            -o backend/backup/backup.json
          python -c "import json;d=json.load(open('backend/backup/backup.json'));print('backup ok:',len(d['events']),'events,',len(d['sources']),'sources')"
          git config user.name "wwaiia"
          git config user.email "wwaiia@users.noreply.github.com"
          git add backend/backup/backup.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "db backup (auto)"; git push; fi
